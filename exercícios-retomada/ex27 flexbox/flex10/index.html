<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>

    <STYLE>
        div.pai{
background-color: grey;
display: flex;
flex-wrap:nowrap;
        }
        div.item{
background-color: aquamarine;
flex-basis: 250px;
border: 1px solid black;
height: 40px;
text-align: center;

        }
        div#a{
flex-shrink:1 ;
flex-grow: 0 ;
        }
        div#b{
flex-shrink: 0 ;
flex-grow:2 ;
        }
        div#c{
flex-shrink: 2 ;
flex-grow: 1 ;
        }
    </STYLE>
</head>
<body>
<div class="pai">
<div class="item" id="a">A</div>
<div class="item" id="b">B</div>
<div class="item" id="C">C</div>

</div>




    
</body>
</html>
