<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>

    <STYLE>
        div.pai{
background-color: grey;
display: flex;
flex-flow: row nowrap;
justify-content: space-between;
height: 300px;
align-items: stretch;
        }
        div.item{
background-color: aquamarine;

border: 1px solid black;
text-align: center;
padding-top: 130px;
        }
    </STYLE>
</head>
<body>
<div class="pai">
<div class="item">caixa A</div>
<div class="item">caixa B</div>
<div class="item">caixa C</div>
<div class="item">caixa D</div>
<div class="item">caixa E</div>
<div class="item">caixa F</div>
    <div class="item">caixa G</div>
</div>




    
</body>
</html>
