<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>

    <STYLE>
        div.pai{
background-color: grey;
display: flex;
flex: wrap;
height: 250px;
        }
        div.item{
background-color: aquamarine;
border: 1px solid black;

text-align: center;
padding: 20px;
        }
#i1{
align-self:center ;
}
#i2{
align-self: auto;
}
 #i3{
align-self: flex-end;
 }
  #i4{
align-self:flex-start ;
  }
  #i5{
align-self: stretch;
  }
 #i6{
align-self: center;
 }
 #i7{
align-self:flex-end ;
 }
        
    </STYLE>
</head>
<body>
<div class="pai">
<div class="item"id=i1>1</div>
<div class="item"id=i2>2</div>
<div class="item"id=i3>3</div>
<div class="item"id=i4>4</div>
<div class="item"id=i5>5</div>
<div class="item"id=i6>6</div>
    <div class="item"id=i7>7</div>
</div>




    
</body>
</html>
