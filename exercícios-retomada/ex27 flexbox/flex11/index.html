<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>

    <STYLE>
        div.pai{
background-color: grey;
display: flex;
flex-wrap:nowrap;
        }
        div.item{
background-color: aquamarine;
border: 1px solid black;
height: 40px;
text-align: center;
flex-basis: 250px;
        }
        div#a{
 flex:0 1 250px;

        }
        div#b{
 flex:2 0 250px;

        }
        div#c{
  flex:4 2 250px;

        }
    </STYLE>
</head>
<body>
<div class="pai">
<div class="item" id="a">A</div>
<div class="item" id="b">B</div>
<div class="item" id="C">C</div>

</div>




    
</body>
</html>
