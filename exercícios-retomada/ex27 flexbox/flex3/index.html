<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>

    <STYLE>
        div.pai{
background-color: grey;
display: flex;
flex-flow: row wrap;
        }
        div.item{
background-color: aquamarine;

border: 1px solid black;
height: 40px;
text-align: center;
padding: 2px;
flex: auto;
        }
    </STYLE>
</head>
<body>
<div class="pai">
<div class="item">exemplo de box A</div>
<div class="item">exemplo de box B</div>
<div class="item">exemplo de box C</div>
<div class="item">exemplo de box D</div>
<div class="item">exemplo de box E</div>
<div class="item">exemplo de box F</div>
    <div class="item">exemplo de box G</div>
</div>




    
</body>
</html>
