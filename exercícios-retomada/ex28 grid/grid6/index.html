<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>configurando grid items</title>
<style>
body{
    background-color: rgb(41, 41, 41);
}

    div#container {
display: grid;
grid-template: repeat(3, 1fr) / repeat(4, 1fr);
height:400px;
border: 3px solid rgb(255, 255, 255);
gap: 3px;
grid-auto-rows: 1fr;
    grid-auto-columns: 1fr;
    margin-top: 25vh;
    }
div.item{
border: 1px solid rgb(219, 219, 219);
}
div#roxo:hover{
background-color: rgb(167, 101, 228);
} 
div#azul:hover{
background-color: rgb(116, 116, 255);
}
div#vermelho:hover{
background-color: rgb(252, 127, 127);
}
div#roxo{
background-color: blueviolet;

grid-area:1/-5/span 1/-1 ;
}
div#azul{
background-color: blue;
grid-area: 2/1/4/3;
}
div#vermelho{
background-color: red;
grid-area: 2/3/4/5;
}


</style>


</head>
<body>
<div id="container">

<div class="item" id="roxo"></div>
<div class="item" id="azul"></div>
<div class="item" id="vermelho"></div>

</div>



    
</body>
</html>
